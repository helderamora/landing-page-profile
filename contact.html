<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/9c358f26fc.js" crossorigin="anonymous"></script>
    <title>Feed Instagram</title>
</head>
<body class="box-body">
    <header class="header">
    
    <div class="logo">Meu site</div>
    <div class="toggle-container">
      <button class="toggle-action"><a  href="/index.html">Home</a></button>
      <button class="toggle-action"><a href="/about.html">Sobre</a></button>
      <button class="toggle-action"><a href="/contact.html">Contato</a></button>
    </div>
  </header>

  <main class="main-contact">
    <div class="main-about">
      <h5 class="title-contact">Vamos conversar</h5>
      <h1>Entre em <span class="text-efect">contato</span></h1>  
      <p class="paragraph">Tem um projeto em mente ou só quer dizer olá? Manda uma mensagem</p>
    </div>

    <div class="container-cantact">
      <div class="container-cardcontact">
        <div class="cards-contact">
          <i class="fa-regular fa-envelope" style="color: blueviolet;"></i>
          <div class="card-description">
            <h5>Email</h5>
            <p class="paragraph">helder@exemple.com</p>
          </div>
        </div>
        <div class="cards-contact">
          <i class="fa-solid fa-tty" style="color: blueviolet;"></i>
          <div class="card-description">
            <h5>Telefone</h5>
            <p class="paragraph">(11) 99999-9999</p>
          </div>  
        </div>
        <div class="cards-contact">
          <i class="fa-solid fa-location-crosshairs" style="color: blueviolet;"></i>
          <div class="card-description">
            <h5>Localização</h5>
            <p class="paragraph">Fortaleza, CE</p>
          </div>
        </div>
        <div class="box-toggles">
          <button href="#" class="toggles">Github</button>
          <button href="#" class="toggles">Linkedin</button>
          <button href="#" class="toggles">Intagram</button>
        </div>
      </div>

        <div class="container-form">
          <form action="#" class="form">
            <p class="contact-title">Nome</p>
            <input type="text" placeholder="Seu nome completo" required>
            <p class="contact-title">Email</p>
            <input type="email" placeholder="seu@email.com" required>
            <p class="contact-title">Assunto</p>
            <input type="text" placeholder="Sobre o que você quer falar?" required>
            <p class="contact-title">Mensagem</p>
            <textarea placeholder="Escreva uma mensagem aqui..." required></textarea>
            <button class="btn-submit" type="submit">Enviar mensagem</button>
          </form>
        </div>
    </div>
  </main>  
  <footer class="footer">
    <p>© 2026 Meu Site. Todos os direitos reservados.</p>
  <footer> 
</body>
</html>
